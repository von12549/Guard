# INACTIVE SPECIMEN. The proposed future active path is .github/workflows/v4-guards.yml.
name: V4 Guardrails

on:
  pull_request:
    branches: [codex/v4-development-base]
    paths:
      - docs/guards/v4/**
      - docs/guards/plans/**
      - .github/workflows/v4-guards.yml
  workflow_dispatch:
    inputs:
      windowsCoverage:
        description: Windows coverage selected in addition to the base-owned classifier
        required: true
        default: auto
        type: choice
        options: [auto, smoke, full]

permissions:
  contents: read

concurrency:
  group: v4-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v4-contract:
    name: v4-contract
    runs-on: ubuntu-latest
    outputs:
      windows-required: ${{ steps.scope.outputs.windows-required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Materialize the previously trusted V4 base outside the target
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          git worktree add --detach "$env:RUNNER_TEMP/v4-base" $env:BASE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "V4_BASE=$env:RUNNER_TEMP/v4-base" >> $env:GITHUB_ENV
          "V4_BASE_SHA=$env:BASE_SHA" >> $env:GITHUB_ENV
      - name: Validate contract, Plan root and exact candidate diff from the trusted base
        id: scope
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pwsh -NoProfile -File "$env:V4_BASE/docs/guards/v4/integrations/github/Invoke-V4TrustedBase.ps1" -Mode Contract -HeadRoot $env:GITHUB_WORKSPACE -BaseSha $env:V4_BASE_SHA -HeadSha $env:HEAD_SHA -GitHubOutput $env:GITHUB_OUTPUT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  v4-linux:
    name: v4-linux
    needs: v4-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Materialize and execute the trusted base runner
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git worktree add --detach "$env:RUNNER_TEMP/v4-base" $env:BASE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File "$env:RUNNER_TEMP/v4-base/docs/guards/v4/integrations/github/Invoke-V4TrustedBase.ps1" -Mode Linux -HeadRoot $env:GITHUB_WORKSPACE -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA -StateRoot "$env:RUNNER_TEMP/v4-state" -EvidenceRoot "$env:RUNNER_TEMP/v4-evidence"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  v4-package:
    name: v4-package
    needs: v4-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Package through the trusted base runner
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git worktree add --detach "$env:RUNNER_TEMP/v4-base" $env:BASE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File "$env:RUNNER_TEMP/v4-base/docs/guards/v4/integrations/github/Invoke-V4TrustedBase.ps1" -Mode Package -HeadRoot $env:GITHUB_WORKSPACE -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA -StateRoot "$env:RUNNER_TEMP/v4-state" -EvidenceRoot "$env:RUNNER_TEMP/v4-evidence"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  v4-windows:
    name: v4-windows
    needs: v4-contract
    if: needs.v4-contract.outputs.windows-required == 'true' || inputs.windowsCoverage == 'smoke' || inputs.windowsCoverage == 'full'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Execute selected Windows coverage through the trusted base runner
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WINDOWS_COVERAGE: ${{ inputs.windowsCoverage || 'auto' }}
        run: |
          git worktree add --detach "$env:RUNNER_TEMP/v4-base" $env:BASE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File "$env:RUNNER_TEMP/v4-base/docs/guards/v4/integrations/github/Invoke-V4TrustedBase.ps1" -Mode Windows -Coverage $env:WINDOWS_COVERAGE -HeadRoot $env:GITHUB_WORKSPACE -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA -StateRoot "$env:RUNNER_TEMP/v4-state" -EvidenceRoot "$env:RUNNER_TEMP/v4-evidence"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  v4-required:
    name: v4-required
    if: always()
    needs: [v4-contract, v4-linux, v4-package, v4-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required V4 verdicts
        shell: pwsh
        env:
          CONTRACT_RESULT: ${{ needs.v4-contract.result }}
          LINUX_RESULT: ${{ needs.v4-linux.result }}
          PACKAGE_RESULT: ${{ needs.v4-package.result }}
          WINDOWS_RESULT: ${{ needs.v4-windows.result }}
          WINDOWS_REQUIRED: ${{ needs.v4-contract.outputs.windows-required }}
        run: |
          if ($env:CONTRACT_RESULT -ne 'success' -or $env:LINUX_RESULT -ne 'success' -or $env:PACKAGE_RESULT -ne 'success') { exit 1 }
          if ($env:WINDOWS_REQUIRED -eq 'true' -and $env:WINDOWS_RESULT -ne 'success') { exit 1 }
          if ($env:WINDOWS_REQUIRED -ne 'true' -and $env:WINDOWS_RESULT -notin @('success','skipped')) { exit 1 }
